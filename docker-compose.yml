   
services:
  wp:
    image: wordpress:6.9.4-php8.3-apache
    container_name: wp
    hostname: wp
    ports:
      - ${WP_PORT-3000}:80
    volumes:
      - ./wp-app:/var/www/html
      - ./config/php.conf.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./wp-data:/var/www/html/wp-content/uploads/db-backup # backup folder
      - ./plugins/bandaloco:/var/www/html/wp-content/plugins/bandaloco
      - ./plugins/fusion-builder:/var/www/html/wp-content/plugins/fusion-builder # Plugin avada builder
      - ./plugins/fusion-core:/var/www/html/wp-content/plugins/fusion-core # Plugin avada core
      - ./theme/Avada:/var/www/html/wp-content/themes/Avada # Theme development
    restart: unless-stopped	
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      #WORDPRESS_TABLE_PREFIX: blo_
      WORDPRESS_DEBUG: 0
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '512M');
        define('FS_METHOD', 'direct');
        
        define( 'WPMS_ON', true );
        // general configuration settings
        define( 'WPMS_MAIL_FROM', 'email@bandaloco.dev' );
        define( 'WPMS_MAIL_FROM_FORCE', true ); 
        define( 'WPMS_MAIL_FROM_NAME', 'bandaloco.dev' );
        define( 'WPMS_MAIL_FROM_NAME_FORCE', true ); 
        define( 'WPMS_SET_RETURN_PATH', false ); // Sets phpmailer->Sender if true.

        // specific configuration settings WPMS_SMTP
        define( 'WPMS_SMTP_HOST', 'maildev' ); 
        define( 'WPMS_SMTP_PORT', 1025 ); 
        // define( 'WPMS_SSL', 'tls' ); 
        define( 'WPMS_SMTP_AUTH', false ); 
        // define( 'WPMS_SMTP_USER', 'email@bandaloco.dev' );
        // define( 'WPMS_SMTP_PASS', '********' );
        define( 'WPMS_SMTP_AUTOTLS', false );
        define( 'WPMS_MAILER', 'smtp' );
    networks:
      bl-eth: null
    depends_on:
      - db

  wpcli:
    image: wordpress:cli-php8.3
    container_name: wpcli
    hostname: wpcli                                                                                                                  
    volumes:
      - ./config/php.conf.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./wp-app:/var/www/html:rw
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    networks:
      bl-eth: null
    depends_on:
      db:
        condition: service_healthy
      wp:
        condition: service_started

  db:
    image: mariadb:11
    container_name: db
    hostname: db
    command: --default-authentication-plugin=mysql_native_password # MariaDB and MySQL
    volumes:
      #- ./wp-data:/docker-entrypoint-initdb.d:rw
      - db_data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ] #MariaDB
      #test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--silent" ] #MySQL
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      bl-eth: null

  # Gui Mysql
  dbeaver:
    image: dbeaver/cloudbeaver:23
    hostname: dbeaver
    container_name: dbeaver
    restart: unless-stopped
    entrypoint: /opt/cloudbeaver/docker-entrypoint.sh
    depends_on:
      - db
    ports:
      - 3080:8978
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace
      - ./tools/dbeaver/config/docker-entrypoint.sh:/opt/cloudbeaver/docker-entrypoint.sh
      - ./tools/dbeaver/config/initial-data-sources.json:/opt/cloudbeaver/conf/initial-data-sources.conf
      - ./tools/dbeaver/config/project-metadata.json:/opt/cloudbeaver/conf/project-metadata.conf
      - ./tools/dbeaver/config/product.conf:/opt/cloudbeaver/conf/product.conf
      - ./tools/dbeaver/config/cloudbeaver.conf:/opt/cloudbeaver/conf/cloudbeaver.conf
#      - ./dbeaver/script:/opt/cloudbeaver/workspace/script
    environment:
      CB_ADMIN_NAME: ${DBEAVER_USER}
      CB_ADMIN_PASSWORD: ${DBEAVAR_PASSWORD}
      CB_SERVER_NAME: dbeaver
    networks:
      bl-eth: null

  maildev:
    image: maildev/maildev
    hostname: maildev
    container_name: maildev
    restart: unless-stopped
    ports:
      - 3081:1080
    environment:
      - TZ=Europe/rome
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    networks:
      bl-eth: null

volumes:
  db_data:
  dbeaver_data: 

networks:
  bl-eth:
    external: true
    name: bl-eth